<!DOCTYPE html>
    <html>
        <head>
            <title>Japan Hazard Exposure Map</title>
            <meta charset="utf-8" />
            <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

            <style>
                #map {height: 100vh;}
            </style>
        </head>
        
        <body>
            <div id="map"></div>

            <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

            <script>
                var map = L.map('map').setView([36.5, 138], 5);

                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
                    attribution: '&copy; OpenStreetMap contributors'
                }).addTo(map);

                var prefectureLayer;
                var volcanoLayer;
                
                function highlightFeature(e){
                    var layer = e.target;
                    
                    layer.setStyle({
                        weight: 3,
                        color: '#666',
                        fillOpacity: 0.7
                    });

                    layer.bringToFront();
                }

                function resetHighlight(e){
                    prefectureLayer.resetStyle(e.target);
                }

                function onEachFeature(feature, layer){
                    layer.on({
                        mouseover: highlightFeature,
                        mouseout: resetHighlight
                    });

                    layer.bindPopup("<b>Prefecture:</b> " + feature.properties.nam);
                }

                Promise.all([
                    fetch('japan_prefectures.geojson').then(res => res.json()),
                    fetch('japan_volcanoes.geojson').then(res => res.json())
                ])
                .then(([prefData, volcData]) => {

                    console.log("Both datasets loaded");

                    prefectureLayer = L.geoJSON(prefData,{
                        style: {
                            color: "blue",
                            weight: 1,
                            fillOpacity: 0.2
                        },
                        onEachFeature: onEachFeature
                    });

                    volcanoLayer = L.geoJSON(volcData,{
                        pointToLayer: function(feature, latlng){
                            return L.circleMarker(latlng,{
                                radius: 6,
                                fillColor: "red",
                                color: "#000",
                                weight: 1,
                                fillOpacity: 0.8
                            });
                        },

                        onEachFeature: function(feature, layer){
                            layer.bindPopup(
                                "<b>Volcano:</b> " + feature.properties.Name +
                                "<br><b>Last eruption:</b> " + feature.properties.LastEruption
                            );
                        }

                    });

                    prefectureLayer.addTo(map);
                    volcanoLayer.addTo(map);

                    var overlayMaps = {
                        "Prefectures": prefectureLayer,
                        "Volcanoes": volcanoLayer
                    };

                    L.control.layers(null, overlayMaps).addTo(map);

                })
                .catch(error => {
                    console.error("Error loading GeoJSON:", error);
                    
                });
            </script>
        </body>
    </html>
