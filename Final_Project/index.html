<!DOCTYPE html>
    <html>
        <head>
            <title>Japan Hazard Exposure Map</title>
            <meta charset="utf-8" />
            <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

            <style>
                #map {height: 100vh;}

                .info.legend {
                    background: white;
                    padding: 10px;
                    line-height: 18px;
                    color: #333;
                    border-radius: 5px;
                }

                .info.legend i {
                    width: 18px;
                    height: 18px;
                    float: left;
                    margin-right: 8px;
                    opacity: 0.7;
                }
                    
            </style>
        </head>
        
        <body>
            <div id="map"></div>

            <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

            <script>
                var map = L.map('map').setView([36.5, 138], 5);

                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
                    attribution: '&copy; OpenStreetMap contributors'
                }).addTo(map);

                var prefectureLayer;
                var volcanoLayer;
                
                function highlightFeature(e){
                    var layer = e.target;
                    
                    layer.setStyle({
                        weight: 3,
                        color: '#666',
                        fillOpacity: 0.7
                    });

                    layer.bringToFront();
                }

                function resetHighlight(e){
                    prefectureLayer.resetStyle(e.target);
                }

                var populationData = {
                    1: 5224614, // Hokkaido
                    2: 1237984,
                    3: 1210534,
                    4: 2301996,
                    5: 959502,
                    6: 1068027,
                    7: 1833152,
                    8: 2867009,
                    9: 1933146,
                    10: 1939110,
                    11: 7344765,
                    12: 6284480,
                    13: 14047594, // Tokyo
                    14: 9237337,
                    15: 2201272,
                    16: 1034814,
                    17: 1132526,
                    18: 766863,
                    19: 809974,
                    20: 2048011,
                    21: 1978742,
                    22: 3633202,
                    23: 7483128,
                    24: 1770254,
                    25: 1413610,
                    26: 2578087,
                    27: 8837685,
                    28: 5465002,
                    29: 1324473,
                    30: 914069,
                    31: 553407,
                    32: 671602,
                    33: 1888432,
                    34: 2799702,
                    35: 1342059,
                    36: 728633,
                    37: 956069,
                    38: 1334841,
                    39: 691527,
                    40: 5101556,
                    41: 811442,
                    42: 1312317,
                    43: 1746740,
                    44: 1123852,
                    45: 1069576,
                    46: 1594225,
                    47: 1467480
                };

                function getColor(d) {
                    return  d > 10000000 ? '#800026' :
                            d > 5000000  ? '#BD0026' :
                            d > 3000000  ? '#E31A1C' :
                            d > 2000000  ? '#FC4E2A' :
                            d > 1000000  ? '#FD8D3C' :
                                           '#FFEDA0';
                }

                function style(feature) {
                    var pop = populationData[feature.properties.id];
                    return {
                        fillColor: getColor(pop),
                        weight: 1,
                        color: 'white',
                        fillOpacity: 0.7
                    };
                }

                 function onEachFeature(feature, layer){
                    layer.on({
                        mouseover: highlightFeature,
                        mouseout: resetHighlight
                    });

                    var pop = populationData[feature.properties.id];
                    
                    layer.bindPopup(
                        "<b>Prefecture:</b> " + feature.properties.nam +
                        "<br><b>Population:</b> " + pop.toLocaleString()
                    );
                }
                
                Promise.all([
                    fetch('japan_prefectures.geojson').then(res => res.json()),
                    fetch('japan_volcanoes.geojson').then(res => res.json())
                ])
                .then(([prefData, volcData]) => {

                    console.log("Both datasets loaded");

                    prefectureLayer = L.geoJSON(prefData,{
                        style: style,
                        onEachFeature: onEachFeature
                    });

                    volcanoLayer = L.geoJSON(volcData,{
                        pointToLayer: function(feature, latlng){
                            return L.circleMarker(latlng,{
                                radius: 6,
                                fillColor: "red",
                                color: "#000",
                                weight: 1,
                                fillOpacity: 0.8
                            });
                        },

                        onEachFeature: function(feature, layer){
                            layer.bindPopup(
                                "<b>Volcano:</b> " + feature.properties.Name +
                                "<br><b>Last eruption:</b> " + feature.properties.LastEruption
                            );
                        }

                    });

                    prefectureLayer.addTo(map);
                    volcanoLayer.addTo(map);

                    var overlayMaps = {
                        "Prefectures": prefectureLayer,
                        "Volcanoes": volcanoLayer
                    };

                    L.control.layers(null, overlayMaps).addTo(map);

                var legend = L.control({position: 'bottomright'});

                legend.onAdd = function(map) {

                    var div = L.DomUtil.crete('div', 'info legend'),
                        grades = [0, 1000000, 2000000, 3000000, 5000000, 10000000],
                        labels = [];
                    
                    div.innerHTML += "<b>Population</b><br>";

                    for (var i = 0; i < grades.length; i++) {
                        div.innerHTML +=
                            '<i style="background:' + getColor(grades[i] + 1) + '"></i> ' +
                            grades[i].toLocaleString() + (grades[i + 1] ? '&ndash;' + grades[i + 1].toLocaleString() + '<br>' : '+');
                    }

                    return div;
                };

                legend.addTo(map);

                })
                .catch(error => {
                    console.error("Error loading GeoJSON:", error);
                    
                });
            </script>
        </body>
    </html>
