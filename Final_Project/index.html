<!DOCTYPE html>
    <html>
        <head>
            <title>Japan Hazard Exposure Map</title>
            <meta charset="utf-8" />
            <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
            <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

            <style>
                #map {height: 100vh;}

                .info.legend {
                    background: white;
                    padding: 10px;
                    line-height: 18px;
                    color: #333;
                    border-radius: 5px;
                    font-size: 13px;
                    line-height: 20px;
                    box-shadow: 0 0 10px rgba(0,0,0,0.2);
                }

                .info.legend i {
                    display: inline-block;
                    width: 18px;
                    height: 18px;
                    margin-right: 8px;
                    opacity: 0.7;
                }

                .quake-icon {
                    position: relative;
                    width: 12px;
                    height: 12px;
                    background: red;
                    border-radius: 50%;
                }

                .quake-icon::before,
                .quake-icon::after {
                    content: '';
                    position: absolute;
                    top: -6px;
                    left: -6px;
                    width: 24px;
                    height: 24px;
                    border: 2px solid red;
                    border-radius: 50%;
                    opacity: 0.5;
                }

                .quake-icon::after {
                    top: -12px;
                    left: -12px;
                    width: 36px;
                    height: 36px;
                    opacity: 0.3;
                }
                
            </style>
        </head>
        
        <body>
            <div id="map"></div>

            <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

            <script>
                // Map Setup
                var map = L.map('map').setView([36.5, 138], 5);
                // Clean basemap (no labels)
                L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
                    attribution: '&copy; OpenStreetMap contributors & CartoDB'
                }).addTo(map);
                // Layers
                var prefectureLayer;
                var allVolcanoLayer;
                var recentVolcanoLayer;
                var holoceneVolcanoLayer;
                var volcanoBufferLayer;
                var earthquakeLayer;
                // Population Data & Style
                var populationData = {
                    1: 5224614, 2: 1237984, 3: 1210534, 4: 2301996, 5: 959502,
                    6: 1068027, 7: 1833152, 8: 2867009, 9: 1933146, 10: 1939110,
                    11: 7344765, 12: 6284480, 13: 14047594, 14: 9237337, 15: 2201272,
                    16: 1034814, 17: 1132526, 18: 766863, 19: 809974, 20: 2048011,
                    21: 1978742, 22: 3633202, 23: 7483128, 24: 1770254, 25: 1413610,
                    26: 2578087, 27: 8837685, 28: 5465002, 29: 1324473, 30: 914069,
                    31: 553407, 32: 671602, 33: 1888432, 34: 2799702, 35: 1342059,
                    36: 728633, 37: 956069, 38: 1334841, 39: 691527, 40: 5101556,
                    41: 811442, 42: 1312317, 43: 1746740, 44: 1123852, 45: 1069576,
                    46: 1594225, 47: 1467480
                };
                
                function getColor(d) {
                    return  d > 10000000 ? '#800026' :
                            d > 5000000  ? '#BD0026' :
                            d > 3000000  ? '#E31A1C' :
                            d > 2000000  ? '#FC4E2A' :
                            d > 1000000  ? '#FD8D3C' :
                                           '#FFEDA0';            
                }
                
                function getQuakeColor(mag) {
                    return  mag > 5 ? 'red' :
                            mag > 3 ? 'orange' :
                                      'yellow';
                }        

                function createQuakeIcon(color){
                    return L.divIcon({
                        className: '',
                        html: `
                        <div style="
                            position: relative;
                            width: 12px;
                            height: 12px;
                            background: ${color};
                            border-radius: 50%;
                        ">
                            <div style="
                                position: absolute;
                                top: -6px;
                                left: -6px;
                                width: 24px;
                                height: 24px;
                                border: 2px solid ${color};
                                border-radius: 50%;
                                opacity: 0.5;
                            "></div>
                            <div style="
                                position: absolute;
                                top: -12px;
                                left: -12px;
                                width: 36px;
                                height: 36px;
                                border: 2px solid ${color};
                                border-radius: 50%;
                                opacity: 0.3;
                            "></div>
                        </div>
                        `,
                        iconSize: [20,20]
                    });
                }
                
                function createTriangleIcon(color) {
                    return L.divIcon({
                        className: '',
                        html: `<div style="
                            width: 0;
                            height: 0;
                            border-left: 8px solid transparent;
                            border-right: 8px solid transparent;
                            border-bottom: 14px solid ${color};
                        "></div>`,
                        iconSize: [12, 12]
                    });
                }   
                // Prefectures
                function highlightFeature(e){
                    var layer = e.target;                    
                    layer.setStyle({
                        weight: 3,
                        color: '#666',
                        fillOpacity: 0.7
                    });                    
                }
                
                function resetHighlight(e){
                    prefectureLayer.resetStyle(e.target);
                }
                
                function style(feature) {
                    var pop = populationData[feature.properties.id];
                    return {
                        fillColor: getColor(pop),
                        weight: 1,
                        color: 'white',
                        fillOpacity: 0.4
                    };
                }
                
                function onEachFeature(feature, layer){
                    layer.on({
                        mouseover: highlightFeature,
                        mouseout: resetHighlight
                    });

                    var pop = populationData[feature.properties.id];                    
                    layer.bindPopup(
                        "<b>Prefecture:</b> " + feature.properties.nam +
                        "<br><b>Population:</b> " + pop.toLocaleString()
                    );
                }              
                // Load data
                Promise.all([
                    fetch('japan_prefectures.geojson').then(res => res.json()),
                    fetch('japan_volcanoes.geojson').then(res => res.json()),
                    fetch('japan_volcanoes_holocene.geojson').then(res => res.json())
                ])
                .then(([prefData, volcData, holoData]) => {
                    // Prefecture layer
                    prefectureLayer = L.geoJSON(prefData,{
                        pane: 'overlayPane',
                        style: function(feature) {
                            var pop = populationData[feature.properties.id];
                            return {
                                fillColor: getColor(pop),
                                weight: 1,
                                color: 'white',
                                fillOpacity: 0.5
                            };
                        },
                        onEachFeature: onEachFeature
                    }).addTo(map);

                    var exposureCache = {};
                    
                    function calculatePopulationExposure(latlng) {
                        var key = latlng.lat.toFixed(3) + "," + latlng.lng.toFixed(3);
                        if (key in exposureCache) return exposureCache[key];
                        var point = turf.point([latlng.lng, latlng.lat]);
                        var buffer = turf.buffer(point, 50, { units: 'kilometers', steps: 4 });
                        var totalPop = 0;
                        prefectureLayer.eachLayer(function(layer) {
                            var poly = layer.feature;
                            var pop = populationData[poly.properties.id];
                            if (!pop) return;
                            if (turf.booleanIntersects(poly, buffer)) {
                                totalPop += pop;
                            }
                        });

                        exposureCache[key] = totalPop;                        
                        return totalPop;
                    }

                    function getRiskColor(pop) {
                        return  pop > 5000000 ? "red" :
                                pop > 1000000 ? "orange" :
                                pop > 500000  ? "yellow" :
                                                "green";
                    }

                    function getRiskLevel(pop) {
                        return  pop > 5000000 ? "Extreme" :
                                pop > 1000000 ? "High" :
                                pop > 500000  ? "Moderate" :
                                                "Low";
                    }
                    // All Volcanoes
                    allVolcanoLayer = L.geoJSON(volcData,{
                        pointToLayer: function(feature, latlng){
                            var pop = calculatePopulationExposure(latlng);
                            var color = getRiskColor(pop);                            
                            return L.circleMarker(latlng,{
                                radius: 6,
                                fillColor: color,
                                color: "#000",
                                weight: 1,
                                fillOpacity: 0.8
                            });
                        },
                        onEachFeature: function(feature, layer){
                            layer.bindPopup(function(){
                                var pop = calculatePopulationExposure(layer.getLatLng());
                                return "<b>Volcano:</b> " + feature.properties.Name +
                                "<br><b>Last Eruption:</b> " + feature.properties.LastEruption +
                                "<br><b>Risk Level:</b> " + getRiskLevel(pop) +
                                "<br><b>Population within 50 km (31 mi):</b> " + pop.toLocaleString();
                            });
                        }
                    });
                    // Recent Volcanoes (triangle + status)
                    recentVolcanoLayer = L.geoJSON(volcData,{
                        filter: function(feature){
                            var year = parseInt(feature.properties.LastEruption);
                            return !isNaN(year) && year >= 1500;
                        },
                        pointToLayer: function(feature, latlng){
                            var pop = calculatePopulationExposure(latlng);
                            var color = getRiskColor(pop);                            
                            return L.marker(latlng, {
                                icon: createTriangleIcon(color)
                            });
                        },
                        onEachFeature: function(feature, layer){
                            layer.bindPopup(function(){
                                var pop = calculatePopulationExposure(layer.getLatLng());
                                return "<b>Volcano:</b> " + feature.properties.Name +                                
                                "<br><b>Status:</b> Recent (after 1500)" +
                                "<br><b>Risk Level:</b> " + getRiskLevel(pop) +
                                "<br><b>Population within 50 km (31 mi):</b> " + pop.toLocaleString();
                            });
                        }
                    });
                    // Holocene (Active)
                    holoceneVolcanoLayer = L.geoJSON(holoData, {
                        pointToLayer: function(feature, latlng){
                            var pop = calculatePopulationExposure(latlng);
                            var color = getRiskColor(pop);
                            return L.marker(latlng, {
                                icon: createTriangleIcon(color)                         
                            });
                        },
                        onEachFeature: function(feature, layer){
                            layer.bindPopup(function(){
                                var pop = calculatePopulationExposure(layer.getLatLng());
                                return "<b>Volcano:</b> " + feature.properties.Name +
                                "<br><b>Status:</b> Active (Holocene)" +                                
                                "<br><b>Risk Level:</b> " + getRiskLevel(pop) +
                                "<br><b>Population within 50 km (31 mi):</b> " + pop.toLocaleString();
                            });
                        }
                    });
                    // Volcano Buffers (50 km)
                    volcanoBufferLayer = L.geoJSON(volcData,{
                        filter: function(feature){
                            var year = parseInt(feature.properties.LastEruption);
                            return !isNaN(year) && year >= 1500;
                        },
                        pointToLayer: function(feature, latlng){
                            return L.circle(latlng,{
                                radius:50000,
                                color: "red",
                                weight: 1,
                                fillColor: "red",
                                fillOpacity: 0.1,
                                interactive: false,
                                pane: 'shadowPane'
                            });
                        }                    
                    });                 
                    // Earthquake layer
                    earthquakeLayer = L.geoJSON(null,{
                        pointToLayer: function(feature, latlng){
                            var color = getQuakeColor(feature.properties.mag);
                            return L.marker(latlng,{
                                icon: createQuakeIcon(color)                           
                            });
                        },
                        onEachFeature: function(feature, layer){
                            layer.bindPopup(
                                "<b>Magnitude:</b> " + feature.properties.mag +
                                "<br><b>Location:</b> " + feature.properties.place
                            );
                        }
                    });                 
                    // Load USGS data
                  
                    // Add layers
                    prefectureLayer.addTo(map);
                    allVolcanoLayer.addTo(map);
                    recentVolcanoLayer.addTo(map);
                    holoceneVolcanoLayer.addTo(map);
                    volcanoBufferLayer.addTo(map);
                    

                    allVolcanoLayer.bringToFront();
                    recentVolcanoLayer.bringToFront();
                    holoceneVolcanoLayer.bringToFront();
                    // Layer control
                    var overlayMaps = {                        
                        "All Volcanoes": allVolcanoLayer,
                        "Recent Volcanoes": recentVolcanoLayer,
                        "Active Volcanoes (Holocene)": holoceneVolcanoLayer,
                        "Volcano Buffers (50km / 31mi)": volcanoBufferLayer,
                        "Earthquakes": earthquakeLayer
                    };

                    L.control.layers(null, overlayMaps).addTo(map);

                    map.on('overlayadd', function(e) {
                        if (e.name === "Earthquakes") {

                            if (!earthquakeLayer._loaded) {

                                fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_week.geojson')
                                .then(res => res.json())
                                .then(data => {

                                    var japanQuakes = {
                                        type: "FeatureCollection",
                                        features: data.features.filter(function(feature){
                                            var lon = feature.geometry.coordinates[0];
                                            var lat = feature.geometry.coordinates[1];
                                            return lat >= 31 && lat <= 45 && lon >= 130 && lon <= 145 && feature.properties.mag >= 2.5;
                                        })
                                    };

                                    earthquakeLayer.addData(japanQuakes);
                                    earthquakeLayer._loaded = true;

                                });
                            }
                        }
                    });                    
                    // Legend
                    var legend = L.control({position: 'bottomright'});

                    legend.onAdd = function() {
                        this._div = L.DomUtil.create('div', 'info legend');
                        updateLegend();
                        return this._div;
                    };

                    legend.addTo(map);

                    function updateLegend() {
                        var div = legend._div;
                        var grades = [0, 1000000, 2000000, 3000000, 5000000, 10000000];

                        div.innerHTML = "";
    
                        if (map.hasLayer(allVolcanoLayer) || map.hasLayer(recentVolcanoLayer) || map.hasLayer(holoceneVolcanoLayer)) {
                            div.innerHTML += "<b>Map Symbols</b><br>";

                            div.innerHTML += "<hr><b>Volcano Risk</b><br>";
                            div.innerHTML += '<i style="background:red"></i> Extreme (>5M)<br>';
                            div.innerHTML += '<i style="background:orange"></i> High (1M–5M)<br>';
                            div.innerHTML += '<i style="background:yellow"></i> Moderate (500k–1M)<br>';
                            div.innerHTML += '<i style="background:green"></i> Low (<500k)<br>';
                        }

                        if (map.hasLayer(volcanoBufferLayer)) {
                            div.innerHTML += '<div style="display:flex;"><div style="width:12px;height:12px;border:1px solid red;background:rgba(255,0,0,0.2);margin-right:6px;"></div>50 km Impact Zone</div>';
                        }

                        if (map.hasLayer(earthquakeLayer)) {
                            div.innerHTML += "<hr><b>Earthquakes</b><br>";
                            div.innerHTML += '<i style="background:red"></i> > 5<br>';
                            div.innerHTML += '<i style="background:orange"></i> 3–5<br>';
                            div.innerHTML += '<i style="background:yellow"></i> < 3<br>';
                        }

                        if (map.hasLayer(prefectureLayer)) {
                            div.innerHTML += "<hr><b>Population</b><br>";
                            for (var i = 0; i < grades.length; i++) {
                                div.innerHTML += '<i style="background:' + getColor(grades[i] + 1) + '"></i> ' +
                                grades[i] + (grades[i+1] ? '&ndash;' + grades[i+1] + '<br>' : '+');
                            }
                        }
                    }

                    map.on('overlayadd', updateLegend);
                    map.on('overlayremove', updateLegend);
                })
                .catch(error => {
                    console.error("Error loading GeoJSON:", error);
                });
                
            </script>
        </body>
    </html>
