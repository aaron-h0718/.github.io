<!DOCTYPE html>
    <html>
        <head>
            <title>Japan Earthquakes Map</title>
<!--Load D3-->
            <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/5.16.0/d3.min.js"></script>
          
            <style>
                body {
                    font-family: Arial, sans-serif;
                }
                h1, h2 {
                    position: absolute;
                    background: white;
                    left: 10px;
                    padding: 5px;
                }
                h2 {
                    top: 550px;
                    left: 10px;
                    font-size: 1em;
                }
                
            </style>
        </head>
    <body>
        <h1>Recent Earthquakes in Japan</h1>
        <h2></h2>
            <script>
// SVG setup
                var width = 1000;
                var height = 600;

                var svg = d3.select("body")
                    .append("svg")
                    .attr("width", width)
                    .attr("height", height);
// Projection (Adjusted for Japan)
                var projection = d3.geoMercator()
                    .translate([width/2, height/2]);

                var geoPath = d3.geoPath().projection(projection);
// Color scale
                var color = d3.scaleLinear()
                    .domain([0, 7])
                    .range(["yellow", "red"]);
// Load Earthquake Data
                d3.json("https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_month.geojson")
                .then(function(data) {  
                    
                    d3.json("https://raw.githubusercontent.com/johan/world.geo.json/master/countries/JPN.geo.json")
                    .then(function(japanData) {

                        projection.fitExtent([[50, 50], [width - 50, height - 50]], japanData);

                    var japanQuakes = data.features.filter(function(d) {
                        return  d.geometry.coordinates[0] > 129 &&
                                d.geometry.coordinates[0] < 146 &&
                                d.geometry.coordinates[1] > 30 &&
                                d.geometry.coordinates[1] < 46;
                    });
// Draw Japan outline
                    svg.append("path")
                        .datum(japanData)
                        .attr("d", geoPath)
                        .attr("fill", "#eee")
                        .attr("stroke", "#333")
                        .attr("stroke-width", 1);                 
// Draw circles
                    svg.selectAll("circle")
                        .data(japanQuakes)
                        .enter()
                        .append("circle")
                        .attr("cx", function(d) {
                            return projection([d.geometry.coordinates[0], d.geometry.coordinates[1]])[0];
                        })
                        .attr("cy", function(d) {
                            return projection([d.geometry.coordinates[0], d.geometry.coordinates[1]])[1];
                        })
                        .attr("r", function(d) {
                            return d.properties.mag ? d.properties.mag * 2 : 0;
                        })
                        .attr("fill", function(d) {
                            return d.properties.mag ? color(d.properties.mag) : "#ccc";
                        })
                        .attr("opacity", 0.7)
                        .on("mouseover", function(d) {
                            d3.select("h2").text(
                                "Magnitude: " + d.properties.mag.toFixed(1) +
                                " | Location: " + d.properties.place
                            );
                            d3.select(this).attr("stroke", "black").attr("stroke-width", 2);
                    })
                        .on("mouseout", function(d) {
                            d3.select("h2").text("");
                            d3.select(this).attr("stroke", "none");
                    });
                });
            });

                var legend = svg.append("g")
                    .attr("transform", "translate(20, 450)");

                var legendData = [1, 3, 5, 7];

                legend.append("text")
                    .attr("x", 0)
                    .attr("y", -10)
                    .text("Magnitude")
                    .style("font-weight", "bold");

                legend.selectAll("circle")
                    .data(legendData)
                    .enter()
                    .append("circle")
                    .attr("cx", 0)
                    .attr("cy", function(d, i) { return i * 30; })
                    .attr("r", function(d) { return d * 2; })
                    .attr("fill", function(d) { return color(d); })
                    .attr("opacity", 0.6);

                legend.selectAll("text")
                    .data(legendData)
                    .enter()
                    .append("text")
                    .attr("x", 40)
                    .attr("y", function(d, i) { return i * 30 + 5; })
                    .text(function(d) { return "Magnitude " + d; });

            </script>
    </body>
    </html>
