<!DOCTYPE html>
    <html>
        <head>
            <title>Lab08_D3</title>
<!--Load D3-->
            <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/5.16.0/d3.min.js"></script>
<!--Load GeoJSON data-->
            <script src="https://rshepard2.github.io/Lab9/data/lnkrds.js"></script>
            <script src="https://rshepard2.github.io/Lab9/data/northeast_lnk_blds.js"></script>
<!--Styles-->
            <style>
                body {
                    position: absolute;
                    font-family: "Proxima Nova", "Montserrat", sans-serif;
                }
                h1, h2 {
                    position: absolute;
                    background: white;
                    left: 10px;
                    font-size: 1.3em;
                    font-weight: 100;
                }
                h2 {
                    top: 30px;
                    font-size: 1em;
                }
                .hover {
                    fill: yellow;
                }
            </style>
        </head>
    <body>
        <h1>Aging Northeast Lincoln Homes</h1>
        <h2></h2>
            <script>
// Width and height
                var width = 1000;
                var height = 600;

                var lowColor = '#bc2a66';
                var highColor = '#f9f9f9';

                var minVal = 1900;
                var maxVal = 2020;

                var ramp = d3.scaleLinear()
                    .domain([minVal, maxVal])
                    .range([lowColor, highColor]);
// Create SVG
                var svg = d3.select("body")
                    .append("svg")
                    .attr("width", width)
                    .attr("height", height);
// Group for geometry
                var g = svg.append("g");
// Projection
                var albersProjection = d3.geoAlbers()
                    .scale(2850000)
                    .rotate([96.6327, 0])
                    .center([0, 40.8497493])
                    .translate([width / 2, height / 2]);
// Path generator
                var geoPath = d3.geoPath()
                    .projection(albersProjection);
// Draw roads
                g.selectAll("path")
                    .data(lnkrds.features)
                    .enter()
                    .append("path")
                    .attr("fill", "#ccc")
                    .attr("stroke", "#333")
                    .attr("d", geoPath);
// Draw buildings
                var lnk_json = svg.append("g");

                lnk_json.selectAll("path")
                    .data(lnkbldngsjson.features)
                    .enter()
                    .append("path")
                    .attr("fill", function(d) {
                        return ramp(d.properties.RESYRBLT);
                    })
                    .attr("stroke", "#999")
                    .attr("d", geoPath)
                    .attr("class", "buildingdata")
                    .on("mouseover", function(d) {
                        d3.select("h2").text("Built in " + d.properties.RESYRBLT);
                        d3.select(this).attr("class", "buildingdata hover");
                    })
                    .on("mouseout", function(d) {
                        d3.select("h2").text("");
                        d3.select(this).attr("class", "buildingdata");
                    });

            </script>
    </body>
    </html>
